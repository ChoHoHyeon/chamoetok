<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>참외톡톡</title>
<style>
  :root{
    --ink:#2b2d42; --muted:#6b7280; --card:#ffffff;
    --primary:#ff9f1c; --primary2:#ffbf69; --blue:#2f80ed; --green:#2ec4b6; --red:#ef476f;
    --safe-top: env(safe-area-inset-top,0px); --safe-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#7ec4ec;font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-touch-callout:none}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .6s}
  #bgimg.on{opacity:1}
  #bubbles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;height:46px}
  .logo{font-weight:900;font-size:22px;letter-spacing:-1px;color:#fff;text-shadow:0 2px 0 #c46d00,0 4px 10px rgba(0,0,0,.25)}
  .logo b{color:#ffe36e}
  .btns{display:flex;gap:8px}
  .icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:17px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .1s}
  .icon-btn:active{transform:scale(.9)}
  main{flex:1;display:flex;justify-content:center;align-items:flex-start;gap:14px;padding:4px 8px;min-height:0}
  .player{display:none;flex-direction:column;align-items:center;gap:6px}
  .player.on{display:flex}
  .hud{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border-radius:14px;padding:6px 8px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .hud .name{font-weight:800;font-size:12px;color:#5b5f7a;white-space:nowrap}
  .hud .score{font-weight:900;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .hud .sub{font-size:11px;color:#6b7280;white-space:nowrap}
  .player.mini .hud{padding:4px 6px}.player.mini .hud .score{font-size:13px}.player.mini .hud .name{font-size:10px}.player.mini .hud .sub{font-size:9px}
  .hud canvas{border-radius:10px}
  .boardwrap{position:relative}
  canvas.board{display:block;border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.28), inset 0 0 0 3px rgba(255,255,255,.75);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(240,247,255,.84));backdrop-filter:blur(8px)}
  canvas.gq{display:block;border-radius:8px}
  #touch{display:flex;justify-content:center;gap:12px;padding:8px 10px 12px}
  #touch button{width:60px;height:60px;border-radius:50%;border:none;background:rgba(255,255,255,.9);font-size:24px;font-weight:800;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.15);cursor:pointer;transition:transform .08s}
  #touch button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  #touch button.drop{background:linear-gradient(180deg,#ffe36e,#ffc83d)}
  @media (hover:hover) and (pointer:fine){ #touch{display:none} .mobile-only{display:none} }
  #touch.hidden{display:none}

  /* ---------- 오버레이 / 카드 ---------- */
  #overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(20,40,80,.42);backdrop-filter:blur(6px);opacity:1;transition:opacity .25s}
  #overlay.hide{opacity:0;pointer-events:none}
  .card{position:relative;background:var(--card);border-radius:28px;padding:28px 24px 22px;width:min(380px,92vw);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 6px rgba(255,255,255,.35);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .title{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1;margin:6px 0 2px;color:#ff9f1c;text-shadow:0 3px 0 #d97706,0 8px 18px rgba(217,119,6,.25);transform:rotate(-2deg)}
  .title b{color:#ffcf3f;text-shadow:0 3px 0 #d99a06,0 8px 18px rgba(217,119,6,.25)}
  .tag{font-size:13px;color:var(--muted);margin:6px 0 14px;font-weight:600}
  .mascots{display:flex;justify-content:center;gap:2px;margin:4px 0 16px;height:74px}
  .mascots canvas,.mascots img{width:66px;height:66px;animation:bob 2.2s ease-in-out infinite}
  .mascots :nth-child(2){animation-delay:.3s}.mascots :nth-child(3){animation-delay:.6s}.mascots :nth-child(4){animation-delay:.9s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
  .menu{display:flex;flex-direction:column;gap:10px}
  .btn{width:100%;padding:15px;border-radius:16px;border:none;font-size:17px;font-weight:800;cursor:pointer;background:#f1f3f8;color:var(--ink);box-shadow:0 4px 0 #d9dde7;transition:transform .08s,box-shadow .08s;font-family:inherit}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9dde7}
  .btn.primary{background:linear-gradient(180deg,#ffb347,#ff9f1c);color:#fff;box-shadow:0 4px 0 #d97706;text-shadow:0 1px 0 rgba(0,0,0,.15)}
  .btn.primary:active{box-shadow:0 1px 0 #d97706}
  .btn.blue{background:linear-gradient(180deg,#5aa0f5,#2f80ed);color:#fff;box-shadow:0 4px 0 #1b5cb8}
  .seg{display:flex;background:#f1f3f8;border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;padding:10px 4px;border:none;border-radius:11px;background:transparent;font-weight:800;font-size:14px;color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .seg button.on.e{color:#0f9d7a}.seg button.on.n{color:#d97706}.seg button.on.h{color:#e0245e}
  .opts{display:flex;justify-content:center;gap:12px;margin-top:2px}
  .opt{font-size:13px;font-weight:700;color:#6b7280;display:flex;align-items:center;gap:6px;cursor:pointer}
  .opt input{width:18px;height:18px;accent-color:var(--primary)}
  .label{font-size:12px;font-weight:800;color:#9aa0b4;text-align:left;margin:6px 4px 2px;letter-spacing:.5px}
  .link{background:none;border:none;color:#6b7280;font-weight:700;font-size:13px;cursor:pointer;margin-top:4px;font-family:inherit;text-decoration:underline;text-underline-offset:3px}
  .help{font-size:13px;color:#4b5563;line-height:1.75;text-align:left;margin-top:12px;background:#f8fafc;border-radius:14px;padding:12px 14px;display:none}
  .help.on{display:block}
  .help b{color:var(--ink)}
  .chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:#6b7280;background:#f1f3f8;border-radius:999px;padding:6px 12px;margin-top:14px}
  .result h2{margin:0;font-size:30px;letter-spacing:-1px}
  .result .big{font-size:46px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums;letter-spacing:-1.5px;margin:4px 0}
  .stats{display:flex;justify-content:center;gap:10px;margin:12px 0 18px}
  .stat{flex:1;background:#f8fafc;border-radius:14px;padding:10px 6px;font-size:11px;color:#6b7280;font-weight:700}
  .stat b{display:block;font-size:20px;color:var(--ink);margin-top:2px}
  .badge{display:inline-block;background:#ffe36e;color:#7a4b00;font-weight:900;font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:6px;letter-spacing:.5px}
  .small{font-size:12px;color:#9ca3af;margin-top:12px}
  #countdown{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;pointer-events:none}
  #countdown span{font-size:min(20vw,110px);font-weight:900;color:#fff;text-shadow:0 6px 0 #d97706,0 14px 30px rgba(0,0,0,.35);animation:cd .8s cubic-bezier(.2,1.4,.4,1)}
  @keyframes cd{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
  #fxcanvas{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
</style>

<body>
<canvas id="bg"></canvas>
<img id="bgimg" alt="">
<canvas id="bubbles"></canvas>
<div id="app">
  <header>
    <div class="logo">참외<b>톡톡</b></div>
    <div class="btns">
      <button class="icon-btn" id="btnHelp" title="게임 방법" style="font-weight:900">?</button>
      <button class="icon-btn" id="btnSpeed" title="속도" style="font-weight:900;font-size:13px">1×</button>
      <button class="icon-btn" id="btnMusic" title="음악">🎵</button>
      <button class="icon-btn" id="btnSound" title="소리">🔊</button>
      <button class="icon-btn" id="btnPause" title="일시정지">⏸</button>
    </div>
  </header>
  <main id="main">
    <div class="player" id="p1">
      <div class="hud">
        <div><div class="name" id="p1name">나</div><div class="score" id="p1score">0</div><div class="sub" id="p1sub"></div></div>
        <canvas class="gq" id="p1gq"></canvas>
        <canvas id="p1next"></canvas>
      </div>
      <div class="boardwrap"><canvas class="board" id="p1board"></canvas></div>
    </div>
    <div class="player" id="p2">
      <div class="hud">
        <div><div class="name" id="p2name">CPU</div><div class="score" id="p2score">0</div><div class="sub" id="p2sub"></div></div>
        <canvas class="gq" id="p2gq"></canvas>
        <canvas id="p2next"></canvas>
      </div>
      <div class="boardwrap"><canvas class="board" id="p2board"></canvas></div>
    </div>
  </main>
  <div id="touch">
    <button data-act="left">◀</button>
    <button data-act="ccw">↺</button>
    <button data-act="drop" class="drop">⬇</button>
    <button data-act="cw">↻</button>
    <button data-act="right">▶</button>
  </div>
  <div id="countdown"><span id="cdtext"></span></div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>
<canvas id="fxcanvas"></canvas>

<script>
'use strict';
const APP_VERSION='0.4.0';
/* =====================================================================
   참외톡톡 — 과일 낙하 퍼즐 (오리지널 게임)
   같은 과일 4개 이상을 붙이면 톡! 연쇄로 상대에게 바위를 보낸다.
   ===================================================================== */

// ---------- 상수 ----------
const COLS=6, ROWS=13, VIS=12;              // row 0은 숨김행
const EMPTY=0, GARBAGE=9;
const CHAIN_POWER=[0,8,16,32,64,96,128,160,192,224,256,288,320,352,384,416,448,480,512,544,576,608,640,672];
const COLOR_BONUS=[0,0,3,6,12,24];
const TARGET=70, MAX_DROP=30;
const DIRS=[[-1,0],[0,1],[1,0],[0,-1]];      // 회전값별 자식 오프셋(위,오른쪽,아래,왼쪽)
const BLOCKS={
  1:{name:'참외',  file:'chamoe',     main:'#F6D344', dark:'#C9A227', light:'#FFF3B0'},
  2:{name:'토마토', file:'tomato',     main:'#E8412C', dark:'#A82A1B', light:'#FF8A78'},
  3:{name:'수박',  file:'watermelon', main:'#3FA34D', dark:'#1F6B2B', light:'#8FD694'},
  4:{name:'연꽃',  file:'lotus',      main:'#F28CB8', dark:'#C4467F', light:'#FFD3E4'},
  5:{name:'가지',  file:'eggplant',   main:'#7B4FB0', dark:'#4C2C75', light:'#B99BE0'},
  9:{name:'바위',  file:'rock',       main:'#9AA0A6', dark:'#5F656B', light:'#D5D9DD'},
};
const groupBonus=n=>n<=4?0:(n>=11?10:n-3);
const idx=(r,c)=>r*COLS+c;
const newGrid=()=>new Uint8Array(ROWS*COLS);
function colTop(g,c){ for(let r=0;r<ROWS;r++) if(g[idx(r,c)]) return r; return ROWS; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

// ---------- 순수 로직 ----------
function gravityMoves(g){
  const moves=[];
  for(let c=0;c<COLS;c++){
    let w=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      const v=g[idx(r,c)];
      if(v){ if(w!==r){ g[idx(w,c)]=v; g[idx(r,c)]=0; moves.push([idx(r,c),idx(w,c)]); } w--; }
    }
  }
  return moves;
}
function findPops(g){
  const seen=new Uint8Array(ROWS*COLS), groups=[];
  for(let r=1;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const i=idx(r,c), v=g[i];
    if(!v||v===GARBAGE||seen[i]) continue;
    const stack=[i], cells=[]; seen[i]=1;
    while(stack.length){
      const k=stack.pop(); cells.push(k);
      const kr=(k/COLS)|0, kc=k%COLS;
      for(const [dr,dc] of DIRS){
        const nr=kr+dr, nc=kc+dc;
        if(nr<1||nr>=ROWS||nc<0||nc>=COLS) continue;
        const j=idx(nr,nc);
        if(!seen[j]&&g[j]===v){ seen[j]=1; stack.push(j); }
      }
    }
    if(cells.length>=4) groups.push({color:v,cells});
  }
  const garb=new Set();
  for(const gr of groups) for(const k of gr.cells){
    const kr=(k/COLS)|0, kc=k%COLS;
    for(const [dr,dc] of DIRS){
      const nr=kr+dr, nc=kc+dc;
      if(nr<1||nr>=ROWS||nc<0||nc>=COLS) continue;
      const j=idx(nr,nc); if(g[j]===GARBAGE) garb.add(j);
    }
  }
  return {groups, garbage:[...garb]};
}
// 3개 연결(터지기 직전) 그룹 — 두근두근 연출용
function findNearGroups(g){
  const seen=new Uint8Array(ROWS*COLS), out=[];
  for(let r=1;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const i=idx(r,c), v=g[i]; if(!v||v===GARBAGE||seen[i]) continue;
    const stack=[i], cells=[]; seen[i]=1;
    while(stack.length){ const k=stack.pop(); cells.push(k); const kr=(k/COLS)|0,kc=k%COLS;
      for(const [dr,dc] of DIRS){ const nr=kr+dr,nc=kc+dc; if(nr<1||nr>=ROWS||nc<0||nc>=COLS) continue; const j=idx(nr,nc); if(!seen[j]&&g[j]===v){seen[j]=1;stack.push(j);} } }
    if(cells.length===3) out.push(...cells);
  }
  return out;
}
function stepScore(pops, chain){
  let P=0, gb=0; const colors=new Set();
  for(const gr of pops.groups){ P+=gr.cells.length; colors.add(gr.color); gb+=groupBonus(gr.cells.length); }
  let mult=CHAIN_POWER[Math.min(chain-1,CHAIN_POWER.length-1)]+COLOR_BONUS[Math.min(colors.size,5)]+gb;
  mult=Math.max(1,Math.min(999,mult));
  return {points:10*P*mult, popped:P};
}
function resolveAll(g){
  let chain=0, score=0, popped=0;
  gravityMoves(g);
  for(;;){
    const p=findPops(g); if(!p.groups.length) break;
    chain++; const s=stepScore(p,chain); score+=s.points; popped+=s.popped;
    for(const gr of p.groups) for(const k of gr.cells) g[k]=0;
    for(const k of p.garbage) g[k]=0;
    gravityMoves(g);
  }
  return {chain,score,popped};
}

// ---------- AI ----------
function simulatePlace(g0, x, rot, colors){
  const [dr,dc]=DIRS[rot], cx=x+dc;
  if(x<0||x>=COLS||cx<0||cx>=COLS) return null;
  const lo=Math.min(2,x,cx), hi=Math.max(2,x,cx);
  for(let c=lo;c<=hi;c++) if(g0[idx(1,c)]) return null;
  const g=g0.slice(); let ra,rc;
  if(rot===1||rot===3){ ra=colTop(g,x)-1; rc=colTop(g,cx)-1; }
  else if(rot===0){ ra=colTop(g,x)-1; rc=ra-1; }
  else { rc=colTop(g,x)-1; ra=rc-1; }
  if(ra<0||rc<0) return null;
  g[idx(ra,x)]=colors[0]; g[idx(rc,cx)]=colors[1];
  return g;
}
function evaluate(gPlaced, level, pending, nColors){
  const g=gPlaced.slice(); const res=resolveAll(g);
  const h=[]; let maxH=0;
  for(let c=0;c<COLS;c++){ h[c]=ROWS-colTop(g,c); if(h[c]>maxH) maxH=h[c]; }
  let v=0;
  for(let c=0;c<COLS;c++){ v-=h[c]*h[c]*2; if(h[c]>9) v-=(h[c]-9)*(h[c]-9)*300; }
  if(h[2]>=8) v-=(h[2]-7)*500;
  for(let c=1;c<COLS;c++) v-=Math.abs(h[c]-h[c-1])*6;
  let pot=0;
  if(level>=1){
    for(let color=1;color<=nColors;color++) for(let c=0;c<COLS;c++){
      const t=colTop(g,c); if(t<1) continue;
      const g2=g.slice(); g2[idx(t-1,c)]=color;
      const r2=resolveAll(g2); if(r2.score>pot) pot=r2.score;
    }
  }
  const danger=h[2]>=8||maxH>=10||pending>=6;
  const fire=level===0?1:(danger?2.5:(res.chain>=4?1.3:res.chain>=2?0.5:0.12));
  v+=res.score*fire+pot*(level>=1?(level>=2?0.9:0.7):0);
  if(res.chain>0&&pending>0) v+=Math.min(res.score/TARGET,pending)*TARGET*1.5;
  if(level===0) v+=(Math.random()-0.5)*600; else if(level===1) v+=(Math.random()-0.5)*150;
  return v;
}
function aiChoose(grid, colors, level, pending, nColors){
  let best=null, bestV=-Infinity;
  for(let x=0;x<COLS;x++) for(let rot=0;rot<4;rot++){
    const g=simulatePlace(grid,x,rot,colors); if(!g) continue;
    const v=evaluate(g,level,pending,nColors);
    if(v>bestV){ bestV=v; best={x,rot}; }
  }
  return best||{x:2,rot:0};
}

// ---------- 사운드 (합성) ----------
const Sound={
  ctx:null,on:true,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,dur,type='sine',gain=0.12,slide=0,delay=0){
    if(!this.on||!this.ctx) return;
    const t=this.ctx.currentTime+delay, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.03);
  },
  noise(dur,gain=0.05,delay=0){
    if(!this.on||!this.ctx) return;
    const t=this.ctx.currentTime+delay, n=this.ctx.sampleRate*dur, buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource(), g=this.ctx.createGain(), f=this.ctx.createBiquadFilter();
    f.type='lowpass'; f.frequency.value=900; s.buffer=buf; g.gain.value=gain; s.connect(f); f.connect(g); g.connect(this.ctx.destination); s.start(t);
  },
  move(){ if(AudioFiles.sfx('move',0.5)) return; this.tone(620,0.04,'triangle',0.035); },
  rotate(){ if(AudioFiles.sfx('rotate',0.6)) return; this.tone(760,0.06,'triangle',0.06,240); },
  land(){ if(AudioFiles.sfx('land',0.7)) return; this.tone(200,0.07,'sine',0.07,-90); this.noise(0.05,0.03); },
  drop(){ if(AudioFiles.sfx('drop',0.7)) return; this.tone(160,0.09,'square',0.05,-70); this.noise(0.08,0.05); },
  pop(chain){ const n='pop'+Math.min(chain,5); if(AudioFiles.sfx(n,1,chain>5?1+Math.min(0.3,(chain-5)*0.06):1)) return;
    const b=440*Math.pow(1.122,Math.min(chain-1,14));

// ---------- BGM (WebAudio 절차 생성, 파일 없음) ----------
const Music={
  on:true, playing:false, tempo:126, next:0, step:0, timer:null, gain:null, rate:1,
  // C장조 펜타토닉 기반 8마디 멜로디 (반음 단위, 0=C5), 0=쉼표는 null
  lead:[0,4,7,4, 9,7,4,null, 0,4,7,9, 12,null,9,7,  4,7,9,7, 4,2,0,null, 2,4,7,4, 2,null,0,null,
        0,4,7,4, 9,7,4,null, 0,4,7,9, 12,null,14,12, 9,12,14,12, 9,7,4,null, 7,4,2,4, 0,null,null,null],
  bass:[-24,null,-24,null,-17,null,-17,null,-19,null,-19,null,-15,null,-15,null],
  chords:[[0,4,7],[0,4,7],[5,9,12],[5,9,12],[7,11,14],[7,11,14],[0,4,7],[0,4,7]],
  f(n){ return 523.25*Math.pow(2,n/12); },
  start(){ if(!Sound.ctx||this.playing||!this.on||AudioFiles.curName) return; this.playing=true; if(!this.gain){ this.gain=Sound.ctx.createGain(); this.gain.gain.value=0.5; this.gain.connect(Sound.ctx.destination); } this.next=Sound.ctx.currentTime+0.1; this.step=0; this.timer=setInterval(()=>this.schedule(),90); },
  stop(){ this.playing=false; if(this.timer) clearInterval(this.timer); this.timer=null; },
  note(freq,t,dur,type,vol){ const c=Sound.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(this.gain); o.start(t); o.stop(t+dur+0.02); },
  schedule(){
    const c=Sound.ctx, spb=60/(this.tempo*this.rate)/4;  // 16분음표 길이
    while(this.next<c.currentTime+0.25){
      const i=this.step%64, t=this.next;
      const m=this.lead[i]; if(m!==null){ this.note(this.f(m),t,spb*0.9,'triangle',0.11); this.note(this.f(m)*2,t,spb*0.5,'sine',0.03); }
      const b=this.bass[i%16]; if(b!==null) this.note(this.f(b),t,spb*1.6,'square',0.045);
      if(i%8===0){ const ch=this.chords[(i/8)|0]; for(const n of ch) this.note(this.f(n-12),t,spb*3.2,'sine',0.035); }
      if(i%4===2){ Sound.noise(0.03,0.012,t-c.currentTime); }
      if(i%8===4){ this.note(180,t,0.08,'sine',0.06); }

    }

  setRate(r){ this.rate=r; },
};
// ---------- 오디오 파일(힉스필드 제작) — 있으면 파일 재생, 없으면 합성음으로 대체 ----------
const AudioFiles={
  buf:{}, names:['pop1','pop2','pop3','pop4','pop5','land','drop','rotate','move','garbage','rockbreak','count','go','ui','warn','win','lose'],
  bgm:{}, cur:null, curName:null, gainNode:null, loaded:false,
  async load(){
    if(!Sound.ctx||this.loaded) return; this.loaded=true;
    if(location.protocol==='file:'){ this.loadElements(); return; }   // 더블클릭 실행: <audio> 방식
    const get=async(n)=>{ try{ const r=await fetch(`assets/audio/${n}.mp3`); if(!r.ok) return null; const ab=await r.arrayBuffer(); return await Sound.ctx.decodeAudioData(ab); }catch(e){ return null; } };
    await Promise.all(this.names.map(async n=>{ const b=await get(n); if(b) this.buf[n]=b; }));
    await Promise.all(['bgm_menu','bgm_play','bgm_danger'].map(async n=>{ const b=await get(n); if(b) this.bgm[n]=b; }));
    if(Object.keys(this.bgm).length){ Music.stop(); this.gainNode=Sound.ctx.createGain(); this.gainNode.gain.value=0.55; this.gainNode.connect(Sound.ctx.destination); this.play(this.wanted||'bgm_menu'); }
  },
  el:{}, elBgm:{}, elMode:false, curEl:null,
  loadElements(){
    this.elMode=true;
    for(const n of this.names){ const a=new Audio(`assets/audio/${n}.mp3`); a.preload='auto'; a.addEventListener('canplaythrough',()=>{ this.el[n]=a; },{once:true}); a.addEventListener('error',()=>{},{once:true}); }
    for(const n of ['bgm_menu','bgm_play','bgm_danger']){ const a=new Audio(`assets/audio/${n}.mp3`); a.loop=true; a.volume=0.5; a.preload='auto'; a.addEventListener('canplaythrough',()=>{ this.elBgm[n]=a; if(!this.curEl&&this.wanted===n){ Music.stop(); this.playEl(n); } },{once:true}); }
  },
  playEl(name){ if(!this.elBgm[name]) return; if(this.curEl===this.elBgm[name]) return; if(this.curEl){ this.curEl.pause(); this.curEl.currentTime=0; } this.curEl=this.elBgm[name]; this.curName=name; this.curEl.volume=Music.on?0.5:0; this.curEl.play().catch(()=>{}); },
  has(n){ return !!this.buf[n]; },
  sfx(n,vol=1,rate=1){ if(this.elMode){ const a=this.el[n]; if(!a||!Sound.on) return false; const c=a.cloneNode(); c.volume=Math.min(1,vol); c.playbackRate=rate; c.play().catch(()=>{}); return true; }
    const b=this.buf[n]; if(!b||!Sound.on) return false; const s=Sound.ctx.createBufferSource(), g=Sound.ctx.createGain(); s.buffer=b; s.playbackRate.value=rate; g.gain.value=vol; s.connect(g); g.connect(Sound.ctx.destination); s.start(); return true; },
  wanted:'bgm_menu',
  play(name){
    this.wanted=name; if(this.elMode){ this.playEl(name); return; } if(!this.bgm[name]||!this.gainNode) return; if(this.curName===name) return;
    const c=Sound.ctx, t=c.currentTime;
    if(this.cur){ const old=this.cur, og=this.curGain; og.gain.setValueAtTime(og.gain.value,t); og.gain.linearRampToValueAtTime(0,t+0.6); old.stop(t+0.65); }
    const s=c.createBufferSource(), g=c.createGain(); s.buffer=this.bgm[name]; s.loop=true; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(Music.on?1:0,t+0.6); s.connect(g); g.connect(this.gainNode); s.start(t);
    this.cur=s; this.curGain=g; this.curName=name;
  },
  setOn(on){ if(this.elMode){ if(this.curEl) this.curEl.volume=on?0.5:0; return; } if(this.curGain){ const t=Sound.ctx.currentTime; this.curGain.gain.cancelScheduledValues(t); this.curGain.gain.setValueAtTime(this.curGain.gain.value,t); this.curGain.gain.linearRampToValueAtTime(on?1:0,t+0.3); } },
};

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawVector(ctx,type,cx,cy,s){
  const B=BLOCKS[type], R=s*0.42;
  ctx.lineWidth=Math.max(1,s*0.05); ctx.strokeStyle=B.dark; ctx.lineJoin='round';
  if(type===1){
    ctx.beginPath(); ctx.ellipse(cx,cy+s*0.02,R*0.82,R,0,0,Math.PI*2); ctx.fillStyle=B.main; ctx.fill(); ctx.stroke();
    ctx.strokeStyle=B.light; ctx.lineWidth=Math.max(1,s*0.06);
    for(const k of [-0.45,0,0.45]){ ctx.beginPath(); ctx.moveTo(cx+R*k*0.8,cy-R*0.85); ctx.quadraticCurveTo(cx+R*k*1.25,cy+s*0.02,cx+R*k*0.8,cy+R*0.85); ctx.stroke(); }
    ctx.fillStyle='#4E9F3D'; rr(ctx,cx-s*0.05,cy-R-s*0.1,s*0.1,s*0.14,s*0.03); ctx.fill();
  } else if(type===2){
    ctx.beginPath(); ctx.arc(cx,cy+s*0.04,R,0,Math.PI*2); ctx.fillStyle=B.main; ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(cx-R*0.35,cy-R*0.3,R*0.28,R*0.16,-0.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3F9142';
    for(let i=0;i<5;i++){ const a=-Math.PI/2+i*(Math.PI*2/5); ctx.beginPath(); ctx.moveTo(cx,cy-R*0.55); ctx.lineTo(cx+Math.cos(a-0.35)*R*0.28,cy-R*0.6+Math.sin(a-0.35)*R*0.28); ctx.lineTo(cx+Math.cos(a)*R*0.55,cy-R*0.6+Math.sin(a)*R*0.45); ctx.closePath(); ctx.fill(); }
  } else if(type===3){
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=B.main; ctx.fill();
    ctx.save(); ctx.clip(); ctx.strokeStyle=B.dark; ctx.lineWidth=Math.max(1.5,s*0.09);
    for(const k of [-0.62,-0.21,0.21,0.62]){ ctx.beginPath(); ctx.moveTo(cx+R*k*0.7,cy-R*1.1); ctx.bezierCurveTo(cx+R*k*1.4,cy-R*0.4,cx+R*k*1.4,cy+R*0.4,cx+R*k*0.7,cy+R*1.1); ctx.stroke(); }
    ctx.restore(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(cx-R*0.35,cy-R*0.35,R*0.22,R*0.13,-0.7,0,Math.PI*2); ctx.fill();
  } else if(type===4){
    ctx.fillStyle=B.main;
    for(let i=0;i<6;i++){ const a=-Math.PI/2+i*Math.PI/3; ctx.save(); ctx.translate(cx+Math.cos(a)*R*0.5,cy+Math.sin(a)*R*0.5); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(0,0,R*0.5,R*0.3,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore(); }
    ctx.fillStyle='#F9D65C'; ctx.beginPath(); ctx.arc(cx,cy,R*0.28,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#C99A1E'; ctx.stroke();
  } else if(type===5){
    ctx.beginPath(); ctx.ellipse(cx,cy+s*0.06,R*0.78,R*0.92,0,0,Math.PI*2); ctx.fillStyle=B.main; ctx.fill(); ctx.stroke();
    ctx.fillStyle='#4E9F3D'; ctx.beginPath(); ctx.moveTo(cx-R*0.55,cy-R*0.7); ctx.quadraticCurveTo(cx,cy-R*0.25,cx+R*0.55,cy-R*0.7); ctx.quadraticCurveTo(cx,cy-R*0.95,cx-R*0.55,cy-R*0.7); ctx.fill();
  } else {
    ctx.fillStyle=B.main; ctx.beginPath();
    [[-0.9,-0.35],[-0.45,-0.95],[0.35,-0.9],[0.95,-0.25],[0.8,0.6],[0.15,0.95],[-0.65,0.8],[-0.98,0.2]].forEach(([px,py],i)=>{ const X=cx+px*R,Y=cy+py*R; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle=B.light; ctx.beginPath(); ctx.ellipse(cx-R*0.35,cy-R*0.5,R*0.2,R*0.1,-0.5,0,Math.PI*2); ctx.fill();
  }
}
// x,y = 셀 좌상단, s = 셀 크기. sx,sy = 스쿼시 배율, rot = 기울기(rad)
function drawBlock(ctx,type,x,y,s,alpha=1,sx=1,sy=1,rot=0,mood=0){
  if(!BLOCKS[type]) return;
  const cx=x+s/2, cy=y+s/2;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.translate(cx,cy+s*0.42); ctx.rotate(rot); ctx.scale(sx,sy); ctx.translate(-cx,-(cy+s*0.42)); // 발바닥 기준 스쿼시
  const im=(mood&&SPRITES_JOY[type])||SPRITES[type];
  if(im){ const d=s*1.14; ctx.drawImage(im,cx-d/2,cy-d/2-s*0.02,d,d); }
  else drawVector(ctx,type,cx,cy,s);
  ctx.restore();
}

  ctx.fillStyle='rgba(255,246,200,.9)'; ctx.beginPath(); ctx.arc(w*0.8,h*0.18,Math.min(w,h)*0.07,0,Math.PI*2); ctx.fill();

// ---------- 플레이어 ----------
class Player{
  constructor(game,id,isAI,level){
    this.game=game; this.id=id; this.isAI=isAI; this.level=level||0;
    this.grid=newGrid(); this.piece=null; this.seqIndex=0;
    this.state='spawn'; this.timer=0; this.fallAcc=0; this.lockT=0; this.softDrop=false;
    this.score=0; this.shown=0; this.turnScore=0; this.carry=0; this.chainNow=0; this.maxChain=0; this.pending=0; this.totalPopped=0;
    this.popCells=[]; this.garbageCells=[]; this.popup=null; this.over=false; this.won=false;
    this.aiTarget=null; this.aiTimer=0;
    this.fx={}; this.particles=[]; this.shake=0; this.flash=0; this.near=[]; this.nearDirty=true; this.t=0;
    this.vis={c:2,ang:-90,rowOff:0}; this.cell=32; this.nextCell=22;
    this.els={ board:document.getElementById(id+'board'), next:document.getElementById(id+'next'), gq:document.getElementById(id+'gq'),
      score:document.getElementById(id+'score'), sub:document.getElementById(id+'sub'), name:document.getElementById(id+'name') };
    this.ctx=this.els.board.getContext('2d');
  }
  get nColors(){ return this.game.nColors(); }
  get human(){ return !this.isAI; }
  fallSpeed(){ return (this.game.mode==='solo' ? 0.8+(this.game.level-1)*0.45 : 1.05)*this.game.speed; }
  fits(r,c,rot){
    const [dr,dc]=DIRS[rot];
    for(const [rr_,cc] of [[r,c],[r+dr,c+dc]]){
      if(cc<0||cc>=COLS||rr_>=ROWS) return false;
      if(rr_<0) continue;
      if(this.grid[idx(rr_,cc)]) return false;
    }
    return true;
  }
  spawn(){
    if(this.grid[idx(1,2)]){ this.game.playerOver(this); return; }
    const colors=this.game.pair(this.seqIndex++);
    this.piece={colors,r:1,c:2,rot:0};
    this.vis={c:2,ang:-90}; this.fallAcc=0; this.lockT=0; this.state='control';
    if(this.isAI){ this.aiTarget=aiChoose(this.grid,colors,this.level,this.pending,this.nColors); this.aiTimer=[0.7,0.4,0.15][this.level]/this.game.speed; }
    this.drawNext();
  }
  move(d){
    if(this.state!=='control'||!this.piece) return false;
    const p=this.piece;
    if(this.fits(p.r,p.c+d,p.rot)){ p.c+=d; if(this.human) Sound.move(); return true; }
    return false;
  }
  rotate(d){
    if(this.state!=='control'||!this.piece) return false;
    const p=this.piece, nr=(p.rot+d+4)%4;
    for(const [kr,kc] of [[0,0],[0,-1],[0,1],[-1,0]]){
      if(this.fits(p.r+kr,p.c+kc,nr)){ p.r+=kr; p.c+=kc; p.rot=nr; if(this.human) Sound.rotate(); return true; }
    }
    if(p.rot===0||p.rot===2){ const fr=(p.rot+2)%4;
      for(const kr of [0,-1]) if(this.fits(p.r+kr,p.c,fr)){ p.r+=kr; p.rot=fr; if(this.human) Sound.rotate(); return true; } }
    return false;
  }
  hardDrop(){
    if(this.state!=='control'||!this.piece) return;
    const p=this.piece; let n=0; while(this.fits(p.r+1,p.c,p.rot)){ p.r++; n++; }
    if(this.human){ Sound.drop(); buzz(12); }
    this.shake+=Math.min(6,n*0.5); this.lock(true);
  }
  lock(hard){
    const p=this.piece; const [dr,dc]=DIRS[p.rot];
    const placed=[];
    for(const [r,c,col] of [[p.r,p.c,p.colors[0]],[p.r+dr,p.c+dc,p.colors[1]]]) if(r>=1){ this.grid[idx(r,c)]=col; placed.push(idx(r,c)); }
    this.piece=null;
    for(const k of placed) this.fx[k]={oy:0,vy:hard?8:3,sq:-1,landed:false};
    this.applyGravity(); if(!hard&&this.human) Sound.land();
    this.state='resolve'; this.nearDirty=true;
  }
  applyGravity(){
    const moves=gravityMoves(this.grid);
    if(!moves.length) return;
    const nf={};
    for(const [from,to] of moves){ const prev=this.fx[from]||{oy:0,vy:0}; const dr=((to/COLS)|0)-((from/COLS)|0); nf[to]={oy:prev.oy-dr,vy:prev.vy||0,sq:-1,landed:false}; delete this.fx[from]; }
    for(const k in this.fx) if(!(k in nf)) nf[k]=this.fx[k];
    this.fx=nf;
  }
  landingCells(){
    const p=this.piece; let r=p.r; while(this.fits(r+1,p.c,p.rot)) r++;
    const [dr,dc]=DIRS[p.rot]; return [[r,p.c,p.colors[0]],[r+dr,p.c+dc,p.colors[1]]];
  }
  emitPop(k,color,chain){
    const cell=this.cell||this.game.cell, cx=(k%COLS)*cell+cell/2, cy=(((k/COLS)|0)-1)*cell+cell/2, B=BLOCKS[color];
    const n=6+Math.min(10,chain*2);
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=cell*(2+Math.random()*4);
      this.particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-cell*2,r:cell*(0.08+Math.random()*0.12),col:Math.random()<0.5?B.main:B.light,life:0.5+Math.random()*0.4,type:0}); }
    if(chain>=2) for(let i=0;i<3;i++){ const a=Math.random()*Math.PI*2, sp=cell*(1+Math.random()*2);
      this.particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-cell,r:cell*0.18,col:'#fff',life:0.6,type:1,rot:Math.random()*6}); }
  }
  update(dt){
    this.t+=dt;
    // 물리 FX
    for(const k in this.fx){ const f=this.fx[k];
      if(f.oy<0){ f.vy+=42*dt; f.oy+=f.vy*dt; if(f.oy>=0){ f.oy=0; f.vy=0; f.sq=0; f.landed=true; if(this.grid[k]===GARBAGE){ this.shake+=1.5; } } }
      else if(f.sq>=0){ f.sq+=dt; if(f.sq>0.32) delete this.fx[k]; }
      else if(f.vy>0){ f.sq=0; }
      else delete this.fx[k];
    }
    if(this.shake>0) this.shake*=Math.exp(-dt*7); if(this.shake<0.05) this.shake=0;
    if(this.flash>0) this.flash=Math.max(0,this.flash-dt*3);
    const cell=this.cell||this.game.cell;
    this.particles=this.particles.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=cell*18*dt; if(p.rot!==undefined) p.rot+=dt*8; return p.life>0; });
    if(this.popup){ this.popup.t-=dt; if(this.popup.t<=0) this.popup=null; }
    this.shown+= (this.score-this.shown)*Math.min(1,dt*7); if(Math.abs(this.score-this.shown)<1) this.shown=this.score;
    if(this.over) return;
    switch(this.state){
      case 'spawn': this.spawn(); break;
      case 'control': {
        const p=this.piece; if(!p) break;
        if(this.isAI){
          this.aiTimer-=dt;
          if(this.aiTimer<=0){
            this.aiTimer=[0.24,0.14,0.06][this.level]/this.game.speed;
            const t=this.aiTarget;
            if(p.rot!==t.rot) this.rotate(1);
            else if(p.c<t.x) this.move(1);
            else if(p.c>t.x) this.move(-1);
            else { this.hardDrop(); break; }
          }
        }
        // 시각 보간(부드러운 이동/회전)
        this.vis.c+=(p.c-this.vis.c)*Math.min(1,dt*32);
        const ta=p.rot*90-90; let diff=((ta-this.vis.ang+540)%360)-180; this.vis.ang+=diff*Math.min(1,dt*26);
        const speed=this.softDrop?18:this.fallSpeed();
        this.fallAcc+=speed*dt;
        while(this.fallAcc>=1){ this.fallAcc-=1; if(this.fits(p.r+1,p.c,p.rot)) p.r++; else { this.fallAcc=0; break; } }
        if(!this.fits(p.r+1,p.c,p.rot)){ this.fallAcc=0; this.lockT+=dt; if(this.lockT>=(this.softDrop?0.05:0.42)) this.lock(false); }
        else this.lockT=0;
        break;
      }
      case 'resolve': {
        // 낙하 애니메이션이 끝날 때까지 대기
        for(const k in this.fx) if(this.fx[k].oy<0) return;
        const pops=findPops(this.grid);
        if(pops.groups.length){
          this.chainNow++; if(this.chainNow>this.maxChain) this.maxChain=this.chainNow;
          const s=stepScore(pops,this.chainNow); this.score+=s.points; this.turnScore+=s.points; this.totalPopped+=s.popped;
          this.popCells=pops.groups.flatMap(g=>g.cells); this.garbageCells=pops.garbage;
          const praise=['','','','GOOD!','GREAT!!','EXCELLENT!!','AMAZING!!!','PERFECT!!!'][Math.min(this.chainNow,7)];
          this.popup={text:this.chainNow>=2?`${this.chainNow}연쇄!`:'톡!',sub:praise,t:this.chainNow>=3?1.2:0.9,big:this.chainNow>=3,chain:this.chainNow};
          Sound.pop(this.chainNow);
          if(this.human){ buzz(this.chainNow>=3?[30,40,60]:20); }
          if(this.chainNow>=2) this.shake+=Math.min(14,2+this.chainNow*2.2);
          if(this.chainNow>=3) this.flash=0.5;
          this.state='pop'; this.timer=0.46; this.popT0=0.46;
        } else this.endTurn();
        break;
      }
      case 'pop': {
        this.timer-=dt;
        if(this.timer<=0){
          for(const k of this.popCells) this.emitPop(k,this.grid[k],this.chainNow);
          if(this.garbageCells.length) Sound.rockbreak();
          for(const k of this.garbageCells) this.emitPop(k,GARBAGE,1);
          for(const k of this.popCells) this.grid[k]=0;
          for(const k of this.garbageCells) this.grid[k]=0;
          this.popCells=[]; this.garbageCells=[]; this.applyGravity(); this.state='resolve'; this.nearDirty=true;
        }
        break;
      }
      case 'garbage': { for(const k in this.fx) if(this.fx[k].oy<0) return; this.timer-=dt; if(this.timer<=0) this.state='spawn'; break; }
    }
  }
  endTurn(){
    const total=this.turnScore+this.carry;
    let attack=Math.floor(total/TARGET); this.carry=total%TARGET; this.turnScore=0; this.chainNow=0;
    const opp=this.game.opponent(this);
    if(attack>0&&opp){ const off=Math.min(attack,this.pending); this.pending-=off; attack-=off; if(attack>0){ opp.pending+=attack; opp.warn=1; } }
    if(this.pending>0&&this.game.mode==='versus'){ this.dropGarbage(Math.min(this.pending,MAX_DROP)); this.state='garbage'; this.timer=0.25; Sound.garbage(); if(this.human) buzz([40,30,40]); }
    else this.state='spawn';
  }
  dropGarbage(n){
    this.pending-=n;
    const full=Math.floor(n/COLS), rem=n%COLS, per=new Array(COLS).fill(full);
    const cols=[0,1,2,3,4,5].sort(()=>Math.random()-0.5); for(let i=0;i<rem;i++) per[cols[i]]++;
    for(let c=0;c<COLS;c++){ let t=colTop(this.grid,c);
      for(let k=0;k<per[c];k++){ t--; if(t<1) break; this.grid[idx(t,c)]=GARBAGE; this.fx[idx(t,c)]={oy:-(t+3+k*0.6),vy:2,sq:-1}; } }
    this.nearDirty=true;
  }
  // ----- 그리기 -----
  draw(cell){
    const ctx=this.ctx, W=cell*COLS, H=cell*VIS;
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(this.shake>0) ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake);
    // 격자 + 위험 표시
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1;
    for(let c=1;c<COLS;c++){ ctx.beginPath(); ctx.moveTo(c*cell,0); ctx.lineTo(c*cell,H); ctx.stroke(); }
    ctx.fillStyle='rgba(239,71,111,.28)'; ctx.beginPath(); ctx.moveTo(2.5*cell,cell*0.12); ctx.lineTo(2.28*cell,cell*0.42); ctx.lineTo(2.72*cell,cell*0.42); ctx.closePath(); ctx.fill();
    if(this.nearDirty){ this.near=findNearGroups(this.grid); this.nearDirty=false; }
    const nearSet=new Set(this.near), popSet=new Set(this.popCells), gSet=new Set(this.garbageCells);
    const prog=this.state==='pop'?1-this.timer/this.popT0:0;
    const danger=!this.over&&(ROWS-colTop(this.grid,2))>=8;
    for(let r=1;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const k=idx(r,c), v=this.grid[k]; if(!v) continue;
      const f=this.fx[k]; let x=c*cell, y=(r-1+(f?f.oy:0))*cell, sx=1, sy=1, rot=0;
      if(f&&f.sq>=0&&f.sq<0.32){ const t=f.sq/0.32, e=Math.sin(t*Math.PI); sx=1+0.28*e; sy=1-0.3*e; }
      // 살아있는 느낌: 숨쉬기(개체마다 위상 다름)
      const br=Math.sin(this.t*2.4+k*0.9); sy*=1+0.025*br; sx*=1-0.018*br;
      if(v!==GARBAGE){
        if(nearSet.has(k)){ const w=Math.sin(this.t*9+k*1.3); rot=w*0.09; sx*=1+0.04*w; sy*=1-0.04*w; }
        else if(danger){ rot=(Math.random()-0.5)*0.08; }                       // 위험하면 덜덜 떨기
        else if(((this.t*0.7+k*0.37)%7)<0.25){ rot=Math.sin(((this.t*0.7+k*0.37)%7)/0.25*Math.PI)*0.12; } // 가끔 고개 갸웃
      }
      if(this.over){ if(this.won){ const j=Math.abs(Math.sin(this.t*6+(k%COLS)*0.5)); y-=j*cell*0.25; sy*=1+0.08*j; } else { sy*=0.86; sx*=1.06; } }
      if(popSet.has(k)||gSet.has(k)){
        const e=prog<0.35?1+0.45*Math.sin(prog/0.35*Math.PI/2):1.45*(1-(prog-0.35)/0.65);
        if(prog<0.35){ ctx.fillStyle='rgba(255,255,255,'+(0.6*(1-prog/0.35))+')'; ctx.beginPath(); ctx.arc(x+cell/2,y+cell/2,cell*0.6*(0.6+prog),0,Math.PI*2); ctx.fill(); }
        drawBlock(ctx,v,x,y,cell,prog<0.35?1:1-(prog-0.35)/0.65,e,e,Math.sin(prog*20)*0.15,1);
      } else drawBlock(ctx,v,x,y,cell,1,sx,sy,rot,(nearSet.has(k)||(this.over&&this.won))?1:0);
    }
    // 조작 중인 조각
    if(this.piece&&this.state==='control'){
      const p=this.piece;
      if(this.game.settings.ghost) for(const [r,c,col] of this.landingCells()) if(r>=1){ ctx.save(); ctx.globalAlpha=0.2; drawBlock(ctx,col,c*cell,(r-1)*cell,cell,1); ctx.restore();
        ctx.strokeStyle='rgba(90,120,160,.5)'; ctx.setLineDash([cell*0.12,cell*0.1]); ctx.lineWidth=2; rr(ctx,c*cell+3,(r-1)*cell+3,cell-6,cell-6,cell*0.25); ctx.stroke(); ctx.setLineDash([]); }
      const yoff=this.fits(p.r+1,p.c,p.rot)?this.fallAcc:0;
      const ax=this.vis.c*cell, ay=(p.r-1+yoff)*cell, a=this.vis.ang*Math.PI/180;
      const bx=ax+Math.cos(a)*cell, by=ay+Math.sin(a)*cell;
      const tilt=(p.c-this.vis.c)*0.35+Math.sin(this.t*3)*0.05;
      if(by>-cell*0.6) drawBlock(ctx,p.colors[1],bx,by,cell,1,1,1,tilt);
      if(ay>-cell*0.6) drawBlock(ctx,p.colors[0],ax,ay,cell,1,1,1,tilt);
    }
    // 파티클
    for(const q of this.particles){ ctx.globalAlpha=Math.min(1,q.life*2); ctx.fillStyle=q.col;
      if(q.type===1){ ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot); ctx.beginPath(); for(let i=0;i<8;i++){ const rr2=i%2?q.r*0.4:q.r, an=i*Math.PI/4; ctx.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2); } ctx.closePath(); ctx.fill(); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(q.x,q.y,q.r*Math.min(1,q.life*3),0,Math.PI*2); ctx.fill(); } }
    ctx.globalAlpha=1;
    if(this.flash>0){ ctx.fillStyle=`rgba(255,255,255,${this.flash*0.55})`; ctx.fillRect(0,0,W,H); }
    // 연쇄 팝업
    if(this.popup){
      const life=this.popup.big?1.2:0.9, t=life-this.popup.t, sc=t<0.18?0.5+0.5*Math.sin(t/0.18*Math.PI/2)*1.25:(t<0.3?1.125-(t-0.18)/0.12*0.125:1);
      const al=this.popup.t<0.25?this.popup.t/0.25:1;
      ctx.save(); ctx.globalAlpha=al; ctx.translate(W/2,H*0.4-t*cell*0.6); ctx.scale(sc,sc); ctx.rotate(-0.06);
      ctx.font=`900 ${this.popup.big?cell*1.35:cell*1.0}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=cell*0.2; ctx.strokeStyle='rgba(90,40,10,.9)'; ctx.strokeText(this.popup.text,0,0);
      const g=ctx.createLinearGradient(0,-cell*0.6,0,cell*0.6); g.addColorStop(0,'#fff8c2'); g.addColorStop(1,this.popup.big?'#ffb020':'#ffe36e'); ctx.fillStyle=g; ctx.fillText(this.popup.text,0,0);
      if(this.popup.sub){ ctx.font=`900 ${cell*0.62}px sans-serif`; ctx.lineWidth=cell*0.14; ctx.strokeText(this.popup.sub,0,cell*1.05); ctx.fillStyle='#fff'; ctx.fillText(this.popup.sub,0,cell*1.05); }
      ctx.restore();
    }
    ctx.restore();
    if(this.over){
      ctx.fillStyle='rgba(20,30,50,.5)'; ctx.fillRect(0,0,W,H);
      ctx.font=`900 ${cell*0.9}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=cell*0.16; ctx.strokeStyle='rgba(40,20,10,.8)'; ctx.fillStyle=this.won?'#ffe36e':'#fff';
      const tx=this.game.mode==='solo'?'게임 끝':(this.won?'승리!':'패배'); ctx.strokeText(tx,W/2,H/2); ctx.fillText(tx,W/2,H/2);
    }
    this.els.score.textContent=Math.round(this.shown).toLocaleString();
    this.els.sub.textContent=this.game.mode==='solo'?`레벨 ${this.game.level} · 최대 ${this.maxChain}연쇄`:`최대 ${this.maxChain}연쇄`;
    this.drawGarbageQueue();
  }
  drawNext(){
    const cv=this.els.next, ctx=cv.getContext('2d'), s=this.nextCell||this.game.nextCell, dpr=window.devicePixelRatio||1;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cv.width,cv.height);
    for(let i=0;i<2;i++){ const pr=this.game.pair(this.seqIndex+i), x=i*(s+6)+3, sc=i?0.82:1;
      ctx.save(); ctx.globalAlpha=i?0.75:1; drawBlock(ctx,pr[1],x,2,s*sc); drawBlock(ctx,pr[0],x,2+s*sc,s*sc); ctx.restore(); }
  }
  drawGarbageQueue(){
    const cv=this.els.gq, ctx=cv.getContext('2d'), dpr=window.devicePixelRatio||1;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cv.width,cv.height);
    if(this.game.mode!=='versus') return;
    let x=2; const big=Math.floor(this.pending/6), small=this.pending%6, s=this.nextCell||this.game.nextCell, w=cv.width/dpr, bob=Math.sin(this.t*6)*1.5;
    for(let i=0;i<big&&x<w-s;i++){ drawBlock(ctx,GARBAGE,x,2+bob,s*1.05); x+=s*1.05+2; }
    for(let i=0;i<small&&x<w-s*0.6;i++){ drawBlock(ctx,GARBAGE,x,2+s*0.35+bob,s*0.62); x+=s*0.62+2; }
  }
}

// ---------- 게임 ----------
class Game{
  constructor(){
    this.mode=null; this.players=[]; this.seq=[]; this.level=1; this.running=false; this.paused=false; this.cell=32; this.nextCell=24;
    this.last=0; this.best=this.loadBest(); this.main=document.getElementById('main'); this.aiLevel=1;
    this.speed=1; try{ this.speed=+localStorage.getItem('chamoetok-speed')||1; }catch(e){}
    this.settings={ghost:true,tapSplit:false,buttons:true}; try{ Object.assign(this.settings,JSON.parse(localStorage.getItem('chamoetok-settings')||'{}')); }catch(e){}
  }
  loadBest(){ try{ return Object.assign({solo:0,chain:0,wins:[0,0,0]},JSON.parse(localStorage.getItem('chamoetok-best')||'{}')); }catch(e){ return {solo:0,chain:0,wins:[0,0,0]}; } }
  saveBest(){ try{ localStorage.setItem('chamoetok-best',JSON.stringify(this.best)); }catch(e){} }
  saveSettings(){ try{ localStorage.setItem('chamoetok-settings',JSON.stringify(this.settings)); }catch(e){} }
  nColors(){ return this.mode==='solo'?(this.level>=5?5:4):4; }
  pair(i){ while(this.seq.length<=i){ const n=this.nColors(); this.seq.push([1+Math.floor(Math.random()*n),1+Math.floor(Math.random()*n)]); } return this.seq[i]; }
  opponent(p){ return this.players.length<2?null:this.players[p===this.players[0]?1:0]; }
  start(mode,level){
    this.mode=mode; this.seq=[]; this.level=1; this.aiLevel=level||0; this.finished=false; this.paused=false; this.dangerOn=false; this.warned=false;
    this.players=[new Player(this,'p1',false,0)];
    if(mode==='versus') this.players.push(new Player(this,'p2',true,level));
    document.getElementById('p1').classList.add('on');
    document.getElementById('p2').classList.toggle('on',mode==='versus');
    document.getElementById('p2name').textContent=['CPU 쉬움','CPU 보통','CPU 어려움'][level]||'CPU';
    this.layout(); UI.hide(); AudioFiles.play('bgm_play');
    this.running=false; this.countdown(()=>{ this.running=true; });
  }
  countdown(done){
    const el=document.getElementById('countdown'), tx=document.getElementById('cdtext'); el.style.display='flex';
    const steps=['3','2','1','톡!']; let i=0;
    const next=()=>{ if(document.hidden){ setTimeout(next,300); return; } if(i>=steps.length){ el.style.display='none'; done(); return; }
      tx.textContent=steps[i]; tx.style.animation='none'; void tx.offsetWidth; tx.style.animation=''; if(i<3) Sound.count(); else Sound.go(); i++; setTimeout(next,i===4?500:650); };
    next();
  }
  playerOver(p){
    p.over=true; p.state='over'; p.shake=10;
    if(this.mode==='versus'){ const opp=this.opponent(p); opp.won=true; opp.over=true; opp.state='over'; if(opp===this.players[0]){ Sound.win(); FX.confetti(); this.best.wins[this.aiLevel]=(this.best.wins[this.aiLevel]||0)+1; } else Sound.over(); }
    else Sound.over();
    buzz([60,40,80]); this.finish();
  }
  finish(){
    if(this.finished) return; this.finished=true; this.running=false;
    const me=this.players[0]; let newBest=false;
    if(this.mode==='solo'&&me.score>this.best.solo){ this.best.solo=me.score; newBest=true; }
    if(me.maxChain>this.best.chain) this.best.chain=me.maxChain;
    this.saveBest(); AudioFiles.setOn(false); setTimeout(()=>{ AudioFiles.play('bgm_menu'); AudioFiles.setOn(Music.on); },3200); setTimeout(()=>UI.result(this,newBest),1100);
  }
  layout(){
    const n=this.players.length||1, dpr=window.devicePixelRatio||1;
    const availW=this.main.clientWidth-16-(n-1)*14, availH=this.main.clientHeight-8-78;
    const portrait=this.main.clientWidth<this.main.clientHeight;
    const ratio2=(n===2&&portrait)?0.62:1;   // 세로 폰 대전: 내 판 크게, 상대 판 작게
    let cell=Math.floor(Math.min(availW/(COLS*(1+(n-1)*ratio2)),availH/VIS)); cell=clamp(cell,16,56);
    this.cell=cell; this.nextCell=Math.max(16,Math.floor(cell*0.68));
    this.players.forEach((p,i)=>{
      const c=i===0?cell:Math.max(12,Math.floor(cell*ratio2)); p.cell=c; p.nextCell=Math.max(12,Math.floor(c*0.68));
      const b=p.els.board; b.style.width=c*COLS+'px'; b.style.height=c*VIS+'px'; b.width=c*COLS*dpr; b.height=c*VIS*dpr; p.ctx.setTransform(dpr,0,0,dpr,0,0);
      const nx=p.els.next, nw=p.nextCell*1.82+12, nh=p.nextCell*2+4; nx.style.width=nw+'px'; nx.style.height=nh+'px'; nx.width=nw*dpr; nx.height=nh*dpr;
      const gq=p.els.gq, gw=Math.max(24,c*COLS-nw-(i===0?80:56)), gh=p.nextCell*1.1+6; gq.style.width=gw+'px'; gq.style.height=gh+'px'; gq.width=gw*dpr; gq.height=gh*dpr;
      p.els.board.parentElement.parentElement.classList.toggle('mini',i===1&&ratio2<1);
      p.drawNext();
    });
    // 미니 상대판은 내 판과 아래를 맞춤
    const e1=document.getElementById('p1'), e2=document.getElementById('p2'); e2.style.marginTop='0px';
    if(ratio2<1){ const d=e1.offsetHeight-e2.offsetHeight; if(d>0) e2.style.marginTop=d+'px'; }
  }
  tick(ts){
    const dt=Math.min(0.05,(ts-this.last)/1000||0); this.last=ts;
    if(this.running&&!this.paused){
      for(const p of this.players) p.update(dt);
      { const h2=ROWS-colTop(this.players[0].grid,2); if(h2>=8) this.dangerOn=true; else if(h2<=6) this.dangerOn=false; const danger=!!this.dangerOn; Music.setRate(danger?1.18:1); AudioFiles.play(danger?'bgm_danger':'bgm_play'); if(danger&&!this.warned){ this.warned=true; Sound.warn(); } if(!danger) this.warned=false; }
      if(this.mode==='solo'){ const lv=1+Math.floor(this.players[0].totalPopped/40); if(lv!==this.level){ this.level=lv; this.players[0].popup={text:`레벨 ${lv}!`,t:1.1,big:true}; Sound.ui(); } }
    } else if(this.finished){ for(const p of this.players) p.update(dt); }
    for(const p of this.players) p.draw(p.cell||this.cell);
    FX.tick(dt); Bubbles.tick(dt);
    requestAnimationFrame(t=>this.tick(t));
  }
}

      const cv=document.getElementById('tcv'), dpr=window.devicePixelRatio||1, W=300, H=190; cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.translate(10,14); pg.draw(ctx,52);

// ---------- 입력 ----------
const game=new Game();
const me=()=>(game.running&&!game.paused)?game.players[0]:null;
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(k)) e.preventDefault();
  if(k==='Escape'||k==='p'||k==='P'){ if(game.paused){ game.paused=false; UI.hide(); } else UI.pause(game); return; }
  const p=me(); if(!p) return;
  if(e.repeat&&(k==='ArrowUp'||k===' '||/^[zxZX]$/.test(k))) return;
  if(k==='ArrowLeft'||k==='a'||k==='A') p.move(-1); else if(k==='ArrowRight'||k==='d'||k==='D') p.move(1);
  else if(k==='ArrowDown'||k==='s'||k==='S') p.softDrop=true; else if(k==='ArrowUp'||k===' '||k==='w'||k==='W') p.hardDrop();
  else if(k==='z'||k==='Z') p.rotate(-1); else if(k==='x'||k==='X') p.rotate(1);
});
document.addEventListener('keyup',e=>{ const p=game.players[0]; if(p&&(e.key==='ArrowDown'||e.key==='s'||e.key==='S')) p.softDrop=false; });
(function(){
  const touch=document.getElementById('touch'); let rep=null, dropT=0, dropDone=false;
  const stop=()=>{ if(rep){ clearInterval(rep); rep=null; } const p=game.players[0]; if(p) p.softDrop=false; if(dropT&&!dropDone){ const q=me(); if(q) q.hardDrop(); } dropT=0; dropDone=false; };
  touch.addEventListener('pointerdown',e=>{
    const b=e.target.closest('button'); if(!b) return; e.preventDefault(); Sound.init(); buzz(6);
    const p=me(); if(!p) return; const act=b.dataset.act;
    if(act==='left'||act==='right'){ const d=act==='left'?-1:1; p.move(d); rep=setInterval(()=>{ const q=me(); if(q) q.move(d); },110); }
    else if(act==='cw') p.rotate(1); else if(act==='ccw') p.rotate(-1);
    else if(act==='drop'){ dropT=performance.now(); dropDone=false; rep=setInterval(()=>{ if(performance.now()-dropT>220){ const q=me(); if(q){ q.softDrop=true; dropDone=true; } } },50); }
  });
  touch.addEventListener('pointerup',stop); touch.addEventListener('pointercancel',stop); touch.addEventListener('pointerleave',stop);
})();
(function(){
  // 표준 모바일 조작: 손가락을 따라 조각이 그대로 이동(1:1) · 탭 = 시계방향 회전 · 아래로 빠르게 튕기기 = 바로 놓기 · 아래로 천천히 끌기 = 빨리 내리기
  const b=document.getElementById('p1board');
  let sx=0,sy=0,t0=0,startCol=0,moved=false,done=false,soft=false,lastY=0,lastT=0,vy=0;
  b.addEventListener('pointerdown',e=>{ Sound.init(); const p=me(); sx=e.clientX; sy=e.clientY; lastY=sy; lastT=t0=performance.now(); moved=false; done=false; soft=false; vy=0; startCol=p&&p.piece?p.piece.c:2; try{ b.setPointerCapture(e.pointerId); }catch(_){} });
  b.addEventListener('pointermove',e=>{
    const p=me(); if(!p||done||!p.piece) return;
    const dx=e.clientX-sx, dy=e.clientY-sy, cell=game.cell, now=performance.now();
    vy=(e.clientY-lastY)/Math.max(1,now-lastT); lastY=e.clientY; lastT=now;   // px/ms
    // 가로: 손가락 위치에 해당하는 열로 즉시 이동
    const target=startCol+Math.round(dx/cell);
    let guard=8; while(p.piece&&p.piece.c!==target&&guard--){ if(!p.move(p.piece.c<target?1:-1)) break; }
    if(Math.abs(dx)>cell*0.35) moved=true;
    // 세로: 빠른 플릭 = 바로 놓기, 천천히 끌기 = 빨리 내리기
    if(dy>cell*0.9&&Math.abs(dy)>Math.abs(dx)*1.2){
      const avg=dy/Math.max(1,now-t0);   // 전체 평균 속도(px/ms)
      if(!soft&&(vy>0.9||avg>0.35)&&now-t0<450){ p.hardDrop(); done=true; p.softDrop=false; buzz(10); }
      else { soft=true; p.softDrop=true; moved=true; }
    } else if(soft&&dy<cell*0.3){ soft=false; p.softDrop=false; }
  });
  const up=e=>{ const p=game.players[0]; if(p) p.softDrop=false; const q=me(); if(!q||done) return;
    if(!moved&&performance.now()-t0<280){ if(game.settings.tapSplit && e.clientX-b.getBoundingClientRect().left<b.clientWidth/2) q.rotate(-1); else q.rotate(1); buzz(6); } };
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
})();
document.getElementById('btnHelp').onclick=()=>{ Sound.init(); Sound.ui(); const wasRunning=game.running&&!game.finished; if(wasRunning) game.paused=true; UI.tutorial(game,()=>{ if(wasRunning){ UI.pause(game); } else UI.menu(game); }); };
function applyButtons(){ document.getElementById('touch').classList.toggle('hidden',game.settings.buttons===false); if(game.players.length) game.layout(); }
applyButtons();

btnSpeed.onclick=()=>{ Sound.init(); Sound.ui(); game.speed=game.speed>=4?1:game.speed*2; btnSpeed.textContent=game.speed+'×'; try{ localStorage.setItem('chamoetok-speed',game.speed); }catch(e){} };
document.getElementById('btnSound').onclick=e=>{ Sound.on=!Sound.on; e.target.textContent=Sound.on?'🔊':'🔇'; Sound.init(); try{ localStorage.setItem('chamoetok-sfx',Sound.on?'1':'0'); }catch(_){} };
const btnMusic=document.getElementById('btnMusic');
try{ Music.on=localStorage.getItem('chamoetok-music')!=='0'; Sound.on=localStorage.getItem('chamoetok-sfx')!=='0'; }catch(_){}
btnMusic.textContent=Music.on?'🎵':'🎵̸'; document.getElementById('btnSound').textContent=Sound.on?'🔊':'🔇';
btnMusic.onclick=()=>{ Music.on=!Music.on; btnMusic.style.opacity=Music.on?'1':'.45'; try{ localStorage.setItem('chamoetok-music',Music.on?'1':'0'); }catch(_){} Sound.init(); AudioFiles.setOn(Music.on); if(Music.on) Music.start(); else Music.stop(); };
btnMusic.style.opacity=Music.on?'1':'.45'; btnMusic.textContent='🎵';
// 첫 사용자 입력 시 오디오 시작 (브라우저 정책)
const kick=()=>{ Sound.init(); AudioFiles.load().then(()=>{ if(Music.on&&!AudioFiles.curName) Music.start(); }); }; document.addEventListener('pointerdown',kick,{once:true}); document.addEventListener('keydown',kick,{once:true});
document.getElementById('btnPause').onclick=()=>{ Sound.init(); if(game.paused){ game.paused=false; UI.hide(); } else if(game.running) UI.pause(game); else UI.menu(game); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(game.running&&!game.finished) UI.pause(game); AudioFiles.setOn(false); if(Sound.ctx) Sound.ctx.suspend(); } else { if(Sound.ctx) Sound.ctx.resume(); AudioFiles.setOn(Music.on); } });
window.addEventListener('resize',()=>{ drawBackground(); FX.resize(); Bubbles.resize(); if(game.players.length) game.layout(); });

drawBackground(); FX.resize(); Bubbles.resize();
Promise.race([Promise.all(spriteLoads),new Promise(r=>setTimeout(r,2500))]).then(()=>UI.menu(game)); requestAnimationFrame(t=>{ game.last=t; game.tick(t); });
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
window.DT={COLS,ROWS,idx,newGrid,gravityMoves,findPops,stepScore,resolveAll,simulatePlace,aiChoose,evaluate,game,Player,UI};
